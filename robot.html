<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Robo Pet 🤖</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      width: 100vw; height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }

    /* Subtle grid floor */
    .floor {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(to top, #0f0f23, transparent);
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    /* Status bar */
    .status-bar {
      position: fixed;
      top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 6px 18px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      letter-spacing: 0.1em;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    /* Robot container — positioned absolutely on the floor */
    #robot {
      position: fixed;
      bottom: 40px;
      left: 200px;
      width: 93px;
      height: 85px;
      cursor: pointer;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transition: transform 0.1s;
      z-index: 10;
    }

    #robot:active { transform: scale(0.92); }

    /* The sprite canvas */
    #spriteCanvas {
      width: 93px;
      height: 85px;
      image-rendering: pixelated;
    }

    /* Speech bubble */
    .bubble {
      position: fixed;
      background: rgba(255,255,255,0.92);
      color: #1a1a2e;
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 20;
      max-width: 200px;
      white-space: normal;
      line-height: 1.5;
    }
    .bubble::after {
      content: '';
      position: absolute;
      bottom: -8px; left: 20px;
      border: 8px solid transparent;
      border-top-color: rgba(255,255,255,0.92);
      border-bottom: 0;
    }
    .bubble.show { opacity: 1; }

    /* Click sparkles */
    .sparkle {
      position: fixed;
      pointer-events: none;
      font-size: 1.2rem;
      z-index: 30;
      animation: sparkFly 0.7s ease-out forwards;
    }
    @keyframes sparkFly {
      0%   { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="floor"></div>
<div class="status-bar" id="statusBar">idle</div>
<div class="bubble" id="bubble"></div>

<div id="robot">
  <canvas id="spriteCanvas" width="93" height="85"></canvas>
</div>

<script>
// ── SPRITE CONFIG ──
const SPRITE_SRC   = 'robot-sprite.png';
const SHEET_COLS   = 11;
const SHEET_ROWS   = 12;
const FRAME_W      = 93;
const FRAME_H      = 85;

// ── ANIMATION DEFINITIONS ──
// Each animation: { name, frames: [{col, row},...], fps, loop, flip? }
const ANIMS = {
  idle: {
    name: 'idle',
    frames: [
      {col:0,row:0},{col:1,row:0},{col:2,row:0},{col:3,row:0},
      {col:4,row:0},{col:5,row:0},{col:6,row:0},{col:7,row:0},
    ],
    fps: 6, loop: true
  },
  walk: {
    name: 'walking',
    frames: [
      {col:0,row:1},{col:1,row:1},{col:2,row:1},{col:3,row:1},
      {col:4,row:1},{col:5,row:1},{col:6,row:1},{col:7,row:1},
      {col:8,row:1},{col:9,row:1},
    ],
    fps: 10, loop: true, moves: true
  },
  angry: {
    name: 'angry 😡',
    frames: [
      {col:0,row:2},{col:1,row:2},{col:2,row:2},{col:3,row:2},
      {col:4,row:2},{col:5,row:2},{col:6,row:2},{col:7,row:2},
    ],
    fps: 8, loop: true
  },
  yellow: {
    name: 'suspicious 👀',
    frames: [
      {col:0,row:3},{col:1,row:3},{col:2,row:3},{col:3,row:3},
      {col:4,row:3},{col:5,row:3},{col:6,row:3},{col:7,row:3},
    ],
    fps: 6, loop: true
  },
  dance: {
    name: 'dancing 🕺',
    frames: [
      {col:0,row:4},{col:1,row:4},{col:2,row:4},{col:3,row:4},
      {col:4,row:4},{col:5,row:4},{col:6,row:4},{col:7,row:4},
      {col:8,row:4},{col:9,row:4},
    ],
    fps: 12, loop: true
  },
  wave: {
    name: 'waving 👋',
    frames: [
      {col:0,row:5},{col:1,row:5},{col:2,row:5},{col:3,row:5},
      {col:4,row:5},{col:5,row:5},{col:6,row:5},{col:7,row:5},
      {col:8,row:5},{col:9,row:5},{col:10,row:5},
    ],
    fps: 8, loop: false
  },
  sleep: {
    name: 'sleeping 💤',
    frames: [
      {col:0,row:6},{col:1,row:6},{col:2,row:6},{col:3,row:6},
      {col:4,row:6},{col:5,row:6},{col:6,row:6},{col:7,row:6},
      {col:8,row:6},{col:9,row:6},
    ],
    fps: 4, loop: true
  },
  fall: {
    name: 'falling 😵',
    frames: [
      {col:0,row:7},{col:1,row:7},{col:2,row:7},{col:3,row:7},
      {col:4,row:7},{col:5,row:7},{col:6,row:7},{col:7,row:7},
    ],
    fps: 10, loop: false
  },
  sit: {
    name: 'sitting 🪑',
    frames: [
      {col:0,row:8},{col:1,row:8},{col:2,row:8},{col:3,row:8},
      {col:4,row:8},{col:5,row:8},{col:6,row:8},{col:7,row:8},
      {col:8,row:8},{col:9,row:8},
    ],
    fps: 5, loop: true
  },
  run: {
    name: 'running 🏃',
    frames: [
      {col:0,row:9},{col:1,row:9},{col:2,row:9},{col:3,row:9},
      {col:4,row:9},{col:5,row:9},{col:6,row:9},{col:7,row:9},
      {col:8,row:9},{col:9,row:9},
    ],
    fps: 14, loop: true, moves: true, speed: 3
  },
  carry: {
    name: 'carrying 📦',
    frames: [
      {col:0,row:10},{col:1,row:10},{col:2,row:10},{col:3,row:10},
      {col:4,row:10},{col:5,row:10},{col:6,row:10},{col:7,row:10},
      {col:8,row:10},{col:9,row:10},
    ],
    fps: 8, loop: true, moves: true, speed: 1.2
  },
  love: {
    name: 'in love 💗',
    frames: [
      {col:9,row:11}, // The heart frame at bottom right
    ],
    fps: 2, loop: true
  },
};

// ── RANDOM ACTIVITY POOL (weighted) ──
const ACTIVITY_POOL = [
  { anim: 'idle',  weight: 25, duration: [3000, 6000] },
  { anim: 'walk',  weight: 20, duration: [3000, 6000] },
  { anim: 'run',   weight: 10, duration: [2000, 4000] },
  { anim: 'dance', weight: 10, duration: [3000, 5000] },
  { anim: 'sleep', weight: 10, duration: [4000, 8000] },
  { anim: 'sit',   weight: 8,  duration: [3000, 6000] },
  { anim: 'angry', weight: 5,  duration: [2000, 4000] },
  { anim: 'yellow',weight: 5,  duration: [2000, 3000] },
  { anim: 'carry', weight: 5,  duration: [3000, 5000] },
  { anim: 'fall',  weight: 2,  duration: [1500, 2000] },
];

const CLICK_QUOTES = [
  "Ow! That tickles! 😂",
  "Beep boop! Hello there! 👋",
  "I'm working here! 🤖",
  "Please don't poke me...",
  "010011 (that means hi!)",
  "Need something? 🔧",
  "My circuits are tingling!",
  "I saw that! 👁️",
  "Careful, I bite! 😤",
  "...did you just click me?",
];

// ── STATE ──
let spriteImg    = null;
let currentAnim  = null;
let frameIdx     = 0;
let frameTimer   = null;
let activityTimer= null;
let robotX       = 200;
let moveDir      = 1;   // 1 = right, -1 = left
let flipped      = false;
let bubbleTimer  = null;
let isMoving     = false;

const canvas    = document.getElementById('spriteCanvas');
const ctx       = canvas.getContext('2d');
const robotEl   = document.getElementById('robot');
const statusBar = document.getElementById('statusBar');
const bubble    = document.getElementById('bubble');

// ── LOAD SPRITE ──
function loadSprite() {
  return new Promise(resolve => {
    spriteImg = new Image();
    spriteImg.onload = resolve;
    spriteImg.src = SPRITE_SRC;
  });
}

// ── DRAW FRAME ──
function drawFrame(col, row, flip = false) {
  ctx.clearRect(0, 0, FRAME_W, FRAME_H);
  ctx.save();
  if (flip) {
    ctx.translate(FRAME_W, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(
    spriteImg,
    col * FRAME_W, row * FRAME_H, FRAME_W, FRAME_H,
    0, 0, FRAME_W, FRAME_H
  );
  ctx.restore();
}

// ── PLAY ANIMATION ──
function playAnim(animKey, onDone) {
  if (frameTimer) clearInterval(frameTimer);
  currentAnim = ANIMS[animKey];
  frameIdx = 0;

  const interval = 1000 / currentAnim.fps;
  statusBar.textContent = currentAnim.name;

  function tick() {
    const f = currentAnim.frames[frameIdx];
    drawFrame(f.col, f.row, flipped);
    frameIdx++;
    if (frameIdx >= currentAnim.frames.length) {
      if (currentAnim.loop) {
        frameIdx = 0;
      } else {
        clearInterval(frameTimer);
        if (onDone) onDone();
        return;
      }
    }
  }
  tick();
  frameTimer = setInterval(tick, interval);
}

// ── MOVE ROBOT ──
let moveRAF = null;
function startMoving(speed = 1.8) {
  isMoving = true;
  const maxX = window.innerWidth - FRAME_W - 20;
  const minX = 20;

  function step() {
    robotX += moveDir * speed;
    if (robotX >= maxX) { robotX = maxX; moveDir = -1; flipped = true; }
    if (robotX <= minX) { robotX = minX; moveDir = 1;  flipped = false; }
    robotEl.style.left = robotX + 'px';
    if (isMoving) moveRAF = requestAnimationFrame(step);
  }
  moveRAF = requestAnimationFrame(step);
}
function stopMoving() {
  isMoving = false;
  if (moveRAF) cancelAnimationFrame(moveRAF);
}

// ── PICK RANDOM ACTIVITY ──
function pickActivity() {
  const totalWeight = ACTIVITY_POOL.reduce((s, a) => s + a.weight, 0);
  let rand = Math.random() * totalWeight;
  for (const act of ACTIVITY_POOL) {
    rand -= act.weight;
    if (rand <= 0) return act;
  }
  return ACTIVITY_POOL[0];
}

// ── SCHEDULE NEXT ACTIVITY ──
function scheduleNext() {
  const act = pickActivity();
  const anim = ANIMS[act.anim];
  const duration = act.duration[0] + Math.random() * (act.duration[1] - act.duration[0]);

  stopMoving();

  // Handle walking/running
  if (anim.moves) {
    playAnim(act.anim);
    startMoving(anim.speed || 1.8);
  } else {
    // Non-moving: face random direction occasionally
    if (Math.random() > 0.6) { flipped = !flipped; moveDir = flipped ? -1 : 1; }
    playAnim(act.anim);
  }

  activityTimer = setTimeout(() => {
    scheduleNext();
  }, duration);
}

// ── SPEECH BUBBLE ──
function showBubble(text) {
  if (bubbleTimer) clearTimeout(bubbleTimer);
  const rect = robotEl.getBoundingClientRect();
  bubble.style.left = rect.left + 'px';
  bubble.style.bottom = (window.innerHeight - rect.top + 10) + 'px';
  bubble.textContent = text;
  bubble.classList.add('show');
  bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 2800);
}

// ── SPARKLE ──
function spawnSparkle(x, y) {
  const emojis = ['✨','⚡','💫','🔧','⭐','💥'];
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = x + 'px';
    s.style.top  = y + 'px';
    const angle = Math.random() * Math.PI * 2;
    const dist  = 30 + Math.random() * 50;
    s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    s.style.animationDelay = (Math.random() * 0.2) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}

// ── CLICK HANDLER ──
robotEl.addEventListener('click', e => {
  const rect = robotEl.getBoundingClientRect();
  spawnSparkle(e.clientX, e.clientY);
  showBubble(CLICK_QUOTES[Math.floor(Math.random() * CLICK_QUOTES.length)]);

  // Interrupt current activity — do wave then resume
  clearTimeout(activityTimer);
  stopMoving();
  playAnim('wave', () => {
    scheduleNext();
  });
});

// ── INIT ──
async function init() {
  await loadSprite();
  playAnim('idle');
  setTimeout(scheduleNext, 2000);
}

init();
</script>
</body>
</html>
