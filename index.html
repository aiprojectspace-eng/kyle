<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Notes (Kononnya)</title>
    <style>
        body { 
            margin: 0; background: #f4f4f9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; transition: 0.3s;
        }
        /* Mode Kerja (Ninja Mode) */
        .work-mode { background: white !important; }
        .work-mode #cat, .work-mode #message { display: none; }
        .work-mode #fake-notes { display: block !important; }

        #cat { width: 150px; cursor: pointer; transition: transform 0.2s; }
        #cat:hover { transform: scale(1.1) rotate(5deg); }
        
        #message {
            margin-top: 20px; padding: 15px; background: white;
            border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 250px; text-align: center; font-weight: bold;
            color: #444; display: none; animation: pop 0.3s ease;
        }

        #fake-notes { 
            display: none; padding: 20px; text-align: left; color: #333; 
            font-family: monospace; font-size: 12px;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Butang Rahsia */
        #ninja-trigger {
            position: fixed; bottom: 0; right: 0; width: 30px; height: 30px;
            cursor: pointer; background: transparent;
        }
    </style>
</head>
<body id="main-body">

    <img id="cat" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG56ZzR6NHpueG56ZzR6NHpueG56ZzR6NHpueG56ZzR6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/3oriO0OEd9QIDdllqo/giphy.gif" onclick="showMessage()">

    <div id="message"></div>

    <div id="fake-notes">
        > SYSTEM-LOG: IDLE<br>
        > WAITING FOR INPUT...<br>
        > ANALYZING DATA_STREAM_01...<br>
        > STATUS: OPTIMIZING WORKFLOW...
    </div>

    <div id="ninja-trigger" onclick="toggleNinja()"></div>

    <script>
        const quotes = [
            "U hensem la harini! ❤️",
            "Sikit lagi nak balik, jom makan sedap japlagi!",
            "I dah rindu la kat u... 😿",
            "Jangan stress, I ada kat sini.",
            "Dah minum air ke belum? Minum sekarang! 💧",
            "U buat kerja gempak gila harini! 🔥"
        ];

        function showMessage() {
            const msgBox = document.getElementById('message');
            msgBox.innerText = quotes[Math.floor(Math.random() * quotes.length)];
            msgBox.style.display = 'block';
            
            // Auto hide mesej lepas 4 saat
            setTimeout(() => { msgBox.style.display = 'none'; }, 4000);
        }

        function toggleNinja() {
            document.getElementById('main-body').classList.toggle('work-mode');
        }
    </script>
</body>
</html>
