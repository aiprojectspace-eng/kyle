<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Robo Pet 🤖</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
    .bg-grid {
      position: fixed; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none;
    }
    .floor { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: linear-gradient(to top, rgba(100,100,255,0.06), transparent); border-top: 1px solid rgba(255,255,255,0.06); }
    .status-bar { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 5px 16px; color: rgba(255,255,255,0.4); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; pointer-events: none; }
    #robot { position: fixed; bottom: 30px; left: 200px; width: 80px; height: 80px; cursor: pointer; z-index: 10; -webkit-tap-highlight-color: transparent; }
    #robot:active { filter: brightness(1.3); }
    #spriteCanvas { width: 80px; height: 80px; image-rendering: pixelated; image-rendering: crisp-edges; }
    .bubble { position: fixed; background: #fff; color: #1a1a2e; border-radius: 10px; padding: 7px 12px; font-size: 12px; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity 0.25s; z-index: 20; max-width: 180px; line-height: 1.5; box-shadow: 0 2px 12px rgba(0,0,0,0.3); }
    .bubble::after { content: ''; position: absolute; bottom: -7px; left: 16px; border: 7px solid transparent; border-top-color: #fff; border-bottom: 0; }
    .bubble.show { opacity: 1; }
    .sparkle { position: fixed; pointer-events: none; z-index: 30; animation: sparkFly 0.7s ease-out forwards; }
    @keyframes sparkFly { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="floor"></div>
<div class="status-bar" id="statusBar">booting...</div>
<div class="bubble" id="bubble"></div>
<div id="robot"><canvas id="spriteCanvas" width="80" height="80"></canvas></div>
<script>
const FRAME_W = 80, FRAME_H = 80;
const ANIMS = {
  idle:   { name:'idle 🤖',   frames:[{col:0,row:0},{col:1,row:0},{col:2,row:0},{col:3,row:0},{col:4,row:0},{col:5,row:0},{col:6,row:0},{col:7,row:0},{col:8,row:0},{col:9,row:0}], fps:8, loop:true },
  lazy:   { name:'lazy 😴',   frames:[{col:0,row:1},{col:1,row:1},{col:2,row:1},{col:3,row:1},{col:4,row:1},{col:5,row:1},{col:6,row:1},{col:7,row:1},{col:8,row:1},{col:9,row:1},{col:10,row:1}], fps:5, loop:true },
  angry:  { name:'angry 😡',  frames:[{col:0,row:2},{col:1,row:2},{col:2,row:2},{col:3,row:2},{col:4,row:2},{col:5,row:2},{col:6,row:2},{col:7,row:2},{col:8,row:2},{col:9,row:2},{col:10,row:2}], fps:10, loop:true },
  boring: { name:'bored 😐',  frames:[{col:0,row:8},{col:1,row:8},{col:2,row:8},{col:3,row:8},{col:4,row:8},{col:5,row:8},{col:6,row:8},{col:7,row:8}], fps:4, loop:true },
};
const POOL = [
  { anim:'idle',   weight:40, duration:[3000,6000], moves:false },
  { anim:'lazy',   weight:25, duration:[4000,8000], moves:false },
  { anim:'angry',  weight:15, duration:[2000,4000], moves:true, speed:2.5 },
  { anim:'boring', weight:20, duration:[3000,7000], moves:true, speed:1.2 },
];
const QUOTES = ["Hey! I'm busy! 😤","Beep boop! 👋","010011 = hi!","Don't poke me 😠","My circuits! 😵","You again? 🙄","BZZZT! ⚡","...seriously? 😑","I saw that! 👁️","Ow. Just... ow."];

let spriteImg=null, currentAnim=null, frameIdx=0, frameTimer=null, actTimer=null;
let robotX=200, moveDir=1, flipped=false, isMoving=false, moveRAF=null, bubbleTimer=null;

const canvas=document.getElementById('spriteCanvas'), ctx=canvas.getContext('2d');
const robotEl=document.getElementById('robot'), statusBar=document.getElementById('statusBar'), bubble=document.getElementById('bubble');

function loadSprite(){ return new Promise(r=>{ spriteImg=new Image(); spriteImg.onload=r; spriteImg.src='robot-sprite.png'; }); }

function drawFrame(col,row,flip){
  ctx.clearRect(0,0,FRAME_W,FRAME_H); ctx.save();
  if(flip){ ctx.translate(FRAME_W,0); ctx.scale(-1,1); }
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(spriteImg, col*FRAME_W, row*FRAME_H, FRAME_W, FRAME_H, 0, 0, FRAME_W, FRAME_H);
  ctx.restore();
}

function playAnim(key,onDone){
  if(frameTimer) clearInterval(frameTimer);
  currentAnim=ANIMS[key]; frameIdx=0; statusBar.textContent=currentAnim.name;
  function tick(){ const f=currentAnim.frames[frameIdx]; drawFrame(f.col,f.row,flipped); frameIdx++; if(frameIdx>=currentAnim.frames.length){ if(currentAnim.loop){ frameIdx=0; } else { clearInterval(frameTimer); if(onDone) onDone(); } } }
  tick(); frameTimer=setInterval(tick, 1000/currentAnim.fps);
}

function startMoving(speed){
  isMoving=true; const maxX=window.innerWidth-FRAME_W-20, minX=20;
  function step(){ robotX+=moveDir*speed; if(robotX>=maxX){robotX=maxX;moveDir=-1;flipped=true;} if(robotX<=minX){robotX=minX;moveDir=1;flipped=false;} robotEl.style.left=robotX+'px'; if(isMoving) moveRAF=requestAnimationFrame(step); }
  moveRAF=requestAnimationFrame(step);
}
function stopMoving(){ isMoving=false; if(moveRAF) cancelAnimationFrame(moveRAF); }

function pickActivity(){ const total=POOL.reduce((s,a)=>s+a.weight,0); let r=Math.random()*total; for(const a of POOL){ r-=a.weight; if(r<=0) return a; } return POOL[0]; }

function scheduleNext(){
  const act=pickActivity(); const dur=act.duration[0]+Math.random()*(act.duration[1]-act.duration[0]);
  stopMoving();
  if(act.moves){ moveDir=Math.random()>0.5?1:-1; flipped=moveDir===-1; playAnim(act.anim); startMoving(act.speed||1.5); }
  else { if(Math.random()>0.5){flipped=!flipped;moveDir=flipped?-1:1;} playAnim(act.anim); }
  actTimer=setTimeout(scheduleNext,dur);
}

function showBubble(text){
  if(bubbleTimer) clearTimeout(bubbleTimer);
  const rect=robotEl.getBoundingClientRect();
  bubble.style.left=Math.max(8,rect.left)+'px'; bubble.style.bottom=(window.innerHeight-rect.top+12)+'px';
  bubble.textContent=text; bubble.classList.add('show');
  bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),2500);
}

function spawnSparkles(x,y){
  const emojis=['⚡','✨','💥','🔧','⭐','💫','🤖'];
  for(let i=0;i<6;i++){
    const s=document.createElement('div'); s.className='sparkle';
    s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left=x+'px'; s.style.top=y+'px'; s.style.fontSize=(0.9+Math.random()*0.7)+'rem';
    const angle=Math.random()*Math.PI*2, dist=30+Math.random()*55;
    s.style.setProperty('--dx',Math.cos(angle)*dist+'px'); s.style.setProperty('--dy',Math.sin(angle)*dist+'px');
    s.style.animationDelay=(Math.random()*0.15)+'s'; document.body.appendChild(s); setTimeout(()=>s.remove(),900);
  }
}

robotEl.addEventListener('click',e=>{
  spawnSparkles(e.clientX,e.clientY);
  showBubble(QUOTES[Math.floor(Math.random()*QUOTES.length)]);
  clearTimeout(actTimer); stopMoving(); playAnim('angry');
  setTimeout(()=>scheduleNext(),1500);
});

async function init(){ await loadSprite(); robotEl.style.left=robotX+'px'; playAnim('idle'); setTimeout(scheduleNext,2000); }
init();
</script>
</body>
</html>
